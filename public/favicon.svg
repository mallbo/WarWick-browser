<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#272730" stroke-width="2"/>

  <!-- Emerald Orbit Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35"/>

  <!-- Glowing Warwick W Emblem -->
  <path d="M34 40 L48 90 L64 54 L80 90 L94 40" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Core AI Nucleus Point -->
  <circle cx="64" cy="54" r="4" fill="#6ee7b7" filter="url(#glow)"/>
</svg>
